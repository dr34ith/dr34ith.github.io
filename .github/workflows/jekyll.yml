# Build and deploy a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Deploy on pushes to the default branch (skip docs-only changes)
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md.example"
      - ".vscode/**"
      - ".devcontainer/**"
      - ".husky/**"

  # Build-only check on pull requests (no deployment)
  pull_request:
    branches: ["main"]

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Least-privilege permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress production deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  JEKYLL_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # 3.1 is end-of-life; remove if you have a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches gems
          cache-version: 0 # bump to force a fresh gem cache

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        # Only upload when we will actually deploy (not on pull requests)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Skip deployment for pull requests
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
