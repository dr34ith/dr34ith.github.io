theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Manila
title: Dreaith
tagline: dora the explorer
description: CTF writeups, walkthroughs, and security learning logs by Dreaith.
url: https://dr34ith.github.io
baseurl: ""

social:
  name: Dreaith
  email: dr34ith@gmail.com
  links:
    - https://github.com/dr34ith
    - https://www.linkedin.com/in/andreann/
    - https://ctftime.org/user/247886
    - https://dr34ith.vercel.app

github:
  username: dr34ith

theme_mode: dark
avatar: /assets/img/avatar.jpg
toc: true
paginate: 10
permalink: /posts/:title/


plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

collections:
  tabs:
    output: true
    permalink: /:name/
    sort_by: order
  tools:
    output: true
    permalink: /tools/:name/
  logs:
    output: true
    permalink: /logs/:path/
defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: ""
      type: logs
    values:
      layout: log
      toc: true

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
